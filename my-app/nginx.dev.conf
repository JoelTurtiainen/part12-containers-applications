events { }
http {
  server {
    listen 80;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      resolver 127.0.0.1;

      proxy_pass http://app:5173;
    }

    location /api/ {
      resolver 127.0.0.1;
      proxy_pass http://server:3001/api/;
    }
  }
}
